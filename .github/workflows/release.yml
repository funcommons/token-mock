name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build boot jar
        run: mvn -B package -DskipTests

      - name: Extract version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/funcommons/token-mock
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: target/token-mock.jar
          body: |
            ## 下载

            | 形态 | 获取方式 |
            |---|---|
            | Boot jar | 本页附件 `token-mock.jar`(要求 JRE 21+) |
            | Docker | `docker run -d -p 9999:9999 ghcr.io/funcommons/token-mock:${{ steps.ver.outputs.version }}` |

            ## 快速开始

            ```bash
            docker run -d --name token-mock -p 9999:9999 ghcr.io/funcommons/token-mock:${{ steps.ver.outputs.version }}

            curl http://localhost:9999/openai/v1/chat/completions \
              -H "Authorization: Bearer sk-mock-openai-1234567890abcdef" \
              -H "Content-Type: application/json" \
              -d '{"model":"gpt-4o","messages":[{"role":"user","content":"你好"}]}'
            ```

            文档:https://funcommons.github.io/token-mock/
